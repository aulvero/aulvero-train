# Finch 85M · Tiny tier
# Planned budget: 32,500 steps x 262,144 tokens = 8.5B tokens.
# With the WSD schedule you can extend a run later by raising max_steps and resuming
# from a checkpoint taken before the decay phase.

model:
  name: finch-85m
  max_seq_len: 2048
  n_layers: 21
  d_model: 512
  n_heads: 8
  n_kv_heads: 2
  d_ff: 1408

pretrain:
  seq_len: 2048
  micro_batch_size: 16         # per GPU; lower it if you run out of memory
  global_batch_tokens: 262144  # gradient accumulation is derived from this
  max_steps: 32500
  learning_rate: 0.001
