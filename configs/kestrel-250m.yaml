# Kestrel 250M · Small tier
# Planned budget: 47,500 steps x 524,288 tokens = 24.9B tokens.
# With the WSD schedule you can extend a run later by raising max_steps and resuming
# from a checkpoint taken before the decay phase.

model:
  name: kestrel-250m
  max_seq_len: 4096
  n_layers: 26
  d_model: 896
  n_heads: 14
  n_kv_heads: 2
  d_ff: 2304

pretrain:
  seq_len: 4096
  micro_batch_size: 8         # per GPU; lower it if you run out of memory
  global_batch_tokens: 524288  # gradient accumulation is derived from this
  max_steps: 47500
  learning_rate: 0.0006
