# Pilot run: Wren's shape on the small pilot data mix, for a few thousand steps.
# Use it to check data, tokenizer, logging, checkpointing and resume end to end
# before spending compute on a real model.
#   make prepare MIX=pilot && make pilot

model:
  name: pilot
  max_seq_len: 2048
  n_layers: 20
  d_model: 384
  n_heads: 6
  n_kv_heads: 2
  d_ff: 1024

pretrain:
  train_bin: data/packed/pilot/train.bin
  val_bin: data/packed/pilot/val.bin
  seq_len: 2048
  micro_batch_size: 16
  global_batch_tokens: 262144
  max_steps: 2000
  warmup_steps: 200
  learning_rate: 0.0012
  eval_interval: 250
  save_interval: 500
